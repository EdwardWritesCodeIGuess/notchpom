name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test timer behavior
        run: swift run TimerCoreChecks
      - name: Build universal app and installer
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPom-macOS
          path: |
            dist/NotchPom.dmg
            dist/NotchPom.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NotchPom-macOS
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/NotchPom.dmg dist/NotchPom.zip dist/SHA256SUMS.txt --verify-tag --title "NotchPom $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
