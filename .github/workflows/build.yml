name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test timer behavior
        run: swift run TimerCoreChecks
      - name: Build test app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPom-macOS
          path: dist/NotchPom.zip
