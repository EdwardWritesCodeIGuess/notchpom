name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test timer behavior
        run: swift run TimerCoreChecks
      - name: Build universal app and installer
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NotchPom-macOS
          path: |
            dist/NotchPom.dmg
            dist/NotchPom.zip
            dist/SHA256SUMS.txt
